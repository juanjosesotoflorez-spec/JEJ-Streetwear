<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ropa de Segunda Mano - Moda Urbana</title>
    <link rel="stylesheet" href="css/estilo3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1><i class="fas fa-recycle"></i> Ropa de Segunda Mano</h1>
            <div class="nav-links">
                <a href="../index.html"><i class="fas fa-home"></i> Inicio</a>
                <a href="ropasubida.html"><i class="fas fa-arrow-left"></i> Volver</a>
                
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="upload-section">
            <h2><i class="fas fa-upload"></i> Subir Prenda</h2>
            <form id="uploadForm" onsubmit="event.preventDefault(); subirPrenda();">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" class="form-input" required placeholder="Ej: Chaqueta Vaquera Levi's">
                        
                        <label>Precio</label>
                        <input type="number" class="form-input" required placeholder="Precio en €">
                        
                        <label>Estado</label>
                        <select class="form-input">
                            <option value="excelente">Excelente</option>
                            <option value="muybueno">Muy bueno</option>
                            <option value="bueno">Bueno</option>
                            <option value="aceptable">Aceptable</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea class="form-input" rows="4" required placeholder="Describe el estado, talla, marca..."></textarea>
                        
                        <label>Categoría</label>
                        <select class="form-input">
                            <option value="camisetas">Camisetas</option>
                            <option value="pantalones">Pantalones</option>
                            <option value="abrigos">Abrigos</option>
                            <option value="zapatos">Zapatos</option>
                            <option value="accesorios">Accesorios</option>
                        </select>

                        <label>Imágenes</label>
                        <input type="file" accept="image/*" multiple required>
                        <div class="image-preview" id="imagePreview"></div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-cloud-upload-alt"></i> Publicar Prenda
                </button>
            </form>
        </div>

        <div class="filters">
            <button class="filter-btn active">Todos</button>
            <button class="filter-btn">Camisetas</button>
            <button class="filter-btn">Pantalones</button>
            <button class="filter-btn">Abrigos</button>
            <button class="filter-btn">Zapatos</button>
            <button class="filter-btn">Accesorios</button>
        </div>

        <div class="products-grid">
            <!-- Ejemplo de producto -->
            <div class="product-card">
                <img src="imagenes/ejemplo1.jpg" alt="Chaqueta Vaquera" class="product-image">
                <div class="product-info">
                    <h3 class="product-title">Chaqueta Vaquera Levi's</h3>
                    <p class="product-price">29.99 €</p>
                    <p class="product-description">Chaqueta vaquera en excelente estado, talla M, poco uso.</p>
                    <div class="product-meta">
                        <span><i class="fas fa-tag"></i> Abrigos</span>
                        <span><i class="fas fa-star"></i> Excelente</span>
                    </div>
                </div>
            </div>

            <!-- Más productos se agregarán dinámicamente -->
        </div>
    </div>

    <script src="javascript/ropa_segunda.js"></script>
    <script src="/js/nav-auth.js"></script>
</body>
</html>
